name: iOS app
description: Installs the workspace, runs the iOS tests and generates Lexidraw.xcodeproj.

inputs:
  fuzz-steps:
    description: The differential fuzzer's step budget; empty keeps the tests' default.
    default: ""

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.0
    - shell: bash
      run: bun install --frozen-lockfile
    - shell: bash
      run: bun x turbo run build --filter=@packages/*
    - shell: bash
      working-directory: apps/ios
      run: bun run test:ts
    - shell: bash
      working-directory: apps/ios
      run: bun run test
      env:
        FUZZ_STEPS: ${{ inputs.fuzz-steps }}
    - shell: bash
      run: brew install xcodegen
    - shell: bash
      working-directory: apps/ios
      run: xcodegen generate
