name: OpenAPI

on:
  pull_request:

jobs:
  copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun x turbo run build --filter=@packages/*
      - run: bun test src/server/api/openapi.test.ts
        working-directory: apps/lexidraw
