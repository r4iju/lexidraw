name: Lexidraw
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  LexidrawIOS:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    APP_BUNDLE_IDENTIFIER: xyz.raiju.lexidraw
    DEVELOPMENT_TEAM: C7X9BCC7LP
    CODE_SIGN_STYLE: Automatic
    # The version people see; the build number is the CI run's. The App Store
    # takes an extension only at its app's version and build.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LEXIDRAW_SERVER_URL: https://lexidraw.vercel.app
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Lexidraw
targets:
  Lexidraw:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LexidrawIOS
        product: LexidrawKit
      - package: LexidrawIOS
        product: DrawingKit
      - package: LexidrawIOS
        product: TextKitEditor
      - package: LexidrawIOS
        product: LexicalSwift
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: App/Lexidraw.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    dependencies:
      - package: LexidrawIOS
        product: LexidrawKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
  # A document in the TextKit editor, for trying it and for the UI scripts,
  # which run against LexicalSwift and against the JS reference.
  EditorHarness:
    type: application
    platform: iOS
    sources:
      - EditorHarness
      - App/MessageAlert.swift
      - App/DocumentView.swift
      - App/MediaCaptionEditor.swift
      - App/DocumentTypography.swift
      - App/Loaded.swift
      - App/EmbeddedDrawing.swift
      - App/EmbeddedHTMLBlock.swift
      - App/RenderedEmbeds.swift
      - App/ArticleBlocks.swift
      - App/ArticleInsertion.swift

      - App/StructuralBlocks.swift
      - App/NativeColumnsView.swift
      - App/DrawingCanvas.swift
      - App/DrawingEditorView.swift
      - App/EditorCanvas.swift
      - App/StyleInspector.swift
      - App/DrawingImages.swift
      # Built by `bun run build:reference`; without it only LexicalSwift runs.
      - path: reference/dist/lexical-reference.js
        buildPhase: resources
        optional: true
    dependencies:
      - package: LexidrawIOS
        product: TextKitEditor
      - package: LexidrawIOS
        product: LexicalSwift
      - package: LexidrawIOS
        product: LexidrawKit
      - package: LexidrawIOS
        product: LexicalReference
      - package: LexidrawIOS
        product: LexicalFuzz
      - package: LexidrawIOS
        product: DrawingKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).editor-harness
        INFOPLIST_KEY_CFBundleDisplayName: Editor Harness
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  EditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EditorUITests
      - UITestSupport
    dependencies:
      - target: EditorHarness
      - package: LexidrawIOS
        product: EditorModelInterface
      - package: LexidrawIOS
        product: TextKitEditor
      - package: LexidrawIOS
        product: LexicalFuzz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).editor-ui-tests
        TEST_TARGET_NAME: EditorHarness
  StructuralPreviewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: EditorHarness
      - package: LexidrawIOS
        product: LexicalSwift
      - package: LexidrawIOS
        product: TextKitEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).structural-preview-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EditorHarness.app/EditorHarness
        BUNDLE_LOADER: $(TEST_HOST)
  # The drawing editor on a bundled drawing with no server, for trying it
  # and for the UI tests.
  DrawingHarness:
    type: application
    platform: iOS
    sources:
      - DrawingHarness
      - HarnessSupport
      - App/DrawingEditorView.swift
      - App/EditorCanvas.swift
      - App/StyleInspector.swift
      - App/DrawingImages.swift
    dependencies:
      - package: LexidrawIOS
        product: LexidrawKit
      - package: LexidrawIOS
        product: DrawingKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).drawing-harness
        INFOPLIST_KEY_CFBundleDisplayName: Drawing Harness
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  DrawingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DrawingUITests
      - UITestSupport
    dependencies:
      - target: DrawingHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).drawing-ui-tests
        TEST_TARGET_NAME: DrawingHarness
  # The app's browser over a small folder tree with no server, for the UI
  # tests of moving between folders.
  BrowserHarness:
    type: application
    platform: iOS
    sources:
      - BrowserHarness
      - HarnessSupport
      - path: App
        excludes: [LexidrawApp.swift, Info.plist, Lexidraw.entitlements, PrivacyInfo.xcprivacy]
    dependencies:
      - package: LexidrawIOS
        product: LexidrawKit
      - package: LexidrawIOS
        product: DrawingKit
      - package: LexidrawIOS
        product: TextKitEditor
      - package: LexidrawIOS
        product: LexicalSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).browser-harness
        INFOPLIST_KEY_CFBundleDisplayName: Browser Harness
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  BrowserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BrowserUITests
    dependencies:
      - target: BrowserHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).browser-ui-tests
        TEST_TARGET_NAME: BrowserHarness
schemes:
  Lexidraw:
    build:
      targets:
        Lexidraw: all
        ShareExtension: all
  EditorHarness:
    build:
      targets:
        EditorHarness: all
    test:
      targets:
        - EditorUITests
        - StructuralPreviewTests
        - package: LexidrawIOS/TextKitEditorTests
  DrawingHarness:
    build:
      targets:
        DrawingHarness: all
    test:
      targets:
        - DrawingUITests
  BrowserHarness:
    build:
      targets:
        BrowserHarness: all
    test:
      targets:
        - BrowserUITests
