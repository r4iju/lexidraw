name: Lexidraw
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  LexidrawIOS:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Lexidraw:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LexidrawIOS
        product: LexidrawKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.raiju.lexidraw
        DEVELOPMENT_TEAM: C7X9BCC7LP
        # The version people see; the build number is the CI run's.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        LEXIDRAW_SERVER_URL: https://dev.hackdocean.com
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lexidraw
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
