name: Lexidraw
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  LexidrawIOS:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    APP_BUNDLE_IDENTIFIER: xyz.raiju.lexidraw
    DEVELOPMENT_TEAM: C7X9BCC7LP
    CODE_SIGN_STYLE: Automatic
    # The version people see; the build number is the CI run's. The App Store
    # takes an extension only at its app's version and build.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LEXIDRAW_SERVER_URL: https://lexidraw.vercel.app
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Lexidraw
targets:
  Lexidraw:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LexidrawIOS
        product: LexidrawKit
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: App/Lexidraw.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    dependencies:
      - package: LexidrawIOS
        product: LexidrawKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
  # A document in the TextKit editor, for trying it and for the UI scripts,
  # which run against LexicalSwift and against the JS reference.
  EditorHarness:
    type: application
    platform: iOS
    sources:
      - EditorHarness
      # Built by `bun run build:reference`; without it only LexicalSwift runs.
      - path: reference/dist/lexical-reference.js
        buildPhase: resources
        optional: true
    dependencies:
      - package: LexidrawIOS
        product: TextKitEditor
      - package: LexidrawIOS
        product: LexicalSwift
      - package: LexidrawIOS
        product: LexicalReference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).editor-harness
        INFOPLIST_KEY_CFBundleDisplayName: Editor Harness
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  EditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EditorUITests
    dependencies:
      - target: EditorHarness
      - package: LexidrawIOS
        product: EditorModelInterface
      - package: LexidrawIOS
        product: LexicalFuzz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).editor-ui-tests
        TEST_TARGET_NAME: EditorHarness
schemes:
  Lexidraw:
    build:
      targets:
        Lexidraw: all
        ShareExtension: all
  EditorHarness:
    build:
      targets:
        EditorHarness: all
    test:
      targets:
        - EditorUITests
